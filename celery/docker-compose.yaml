# version: "3.9"

services:

  celery:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: celery
    command: ["celery", "-A", "app.main", "worker", "--loglevel=INFO", "--logfile=/logs/worker.log"]
    volumes:
      - ./logs:/logs
    env_file: .env
    environment:
      - ENVIRONMENT=prod
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - jobsearch_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"  # RabbitMQ
      - "15672:15672"  # Management interface
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - jobsearch_network

  redis:
    image: redis:latest 
    container_name: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always
    networks:
      - jobsearch_network

volumes:
  rabbitmq_data:
  logs:

networks:
  jobsearch_network:
    external: true
    name: jobsearch_network
