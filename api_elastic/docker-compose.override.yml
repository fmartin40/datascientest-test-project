# ce docker-compose.override.yml est chargé par le run.sh avec le mode dev
# il permet d'ajoute le volume app et de relancer le server à chaque modification --reload

services:
  api_elastic:
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "${API_ELASTIC_PORT}"]
