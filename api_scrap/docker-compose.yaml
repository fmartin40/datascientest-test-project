services:

  api-scrap:
    build: .
    container_name: api-scrap
    env_file: .env
    volumes:
      - ./app:/app/app
    ports:
      - "${API_SCRAP_PORT}:${API_SCRAP_PORT}"
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "${API_SCRAP_PORT}"]
    networks:
      - jobsearch_network

networks:
  jobsearch_network:
    external: true

