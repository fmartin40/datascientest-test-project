# ce docker-compose.override.yml est chargé par le run.sh avec le mode dev
# il permet d'ajoute le volume app et derelancer le server à chaque modification --reload

services:
  elastic_api:
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
